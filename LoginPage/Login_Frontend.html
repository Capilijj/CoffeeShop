<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account sign in: Starbucks Coffee Company</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>
    <header class="header">
        <a href="#" class="Image">
            <img src="C:\Users\nolas\OneDrive\Documents\Desktop\Coffeeshop\Image\Logo.png" alt="Starbucks" class="Image">
        </a>
    </header>

    <div class="login-container">
        <h1>Sign in or create an account</h1>

        <p class="required-field-note">* indicates required field</p>

        <form class="login-form">
            <div class="form-group">
                <label for="username" class="sr-only">Username or email address</label>
                <input type="text" id="username" name="username" placeholder="* Username or email address" required>
            </div>

            <div class="form-group password-group">
                <label for="password" class="sr-only">Password</label>
                <input type="password" id="password" name="password" placeholder="* Password" required>
                <span class="password-toggle" onclick="togglePasswordVisibility()">
                    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"></path>
                    </svg>
                </span>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="keepSignedIn" name="keepSignedIn" checked>
                <label for="keepSignedIn">Keep me signed in. <a href="#" class="details-link">Details</a></label>
            </div>

            <div class="forgot-links">
                <a href="#" class="forgot-link">Forgot your username?</a>
                <a href="#" class="forgot-link">Forgot your password?</a>
            </div>

            <button type="submit" class="sign-in-button">Sign in</button>
        </form>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            const passwordToggle = document.querySelector('.password-toggle svg');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                // You might change the SVG icon here to an "eye-slash" icon
                // For simplicity, we just toggle type
            } else {
                passwordField.type = 'password';
                // Change back to "eye" icon
            }
        }

        // Optional: Prevent default form submission for demonstration
        document.querySelector('.login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('This is a demo. Sign in functionality is not implemented.');
        });
    </script>
</body>
</html>
